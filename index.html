<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/med-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Med Scrapper - Your ultimate tool to compare medicine prices across top pharmacies like PharmEasy, 1mg, and NetMeds. Find the best deals instantly." />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf9" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet">
  <script>
    ;(function () {
      var stored = null
      try { stored = localStorage.getItem('theme') } catch (e) { /* ignore */ }
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
    })()
  </script>
  <title>MedScrapper | Compare & Save on Medicines</title>
</head>

<body class="bg-stone-50 font-sans text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-50">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
